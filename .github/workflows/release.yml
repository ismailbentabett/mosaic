name: Release apps

# Builds the Android APK and the Windows installer from the offline demo build
# and attaches both to a GitHub Release. Push a tag like v1.0.0 to run it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (e.g. v1.0.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build:native
      - run: npx cap add android
      - run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#0F172A' --iconBackgroundColorDark '#0F172A'
          --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#0b0b12'
      - run: npx cap sync android
      - name: Build APK
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Mosaic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: web/Mosaic.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri
      - run: npm ci
      - run: npm run build:native
      - run: npx tauri icon assets/icon-only.png
      - run: npx tauri build
      - name: Collect installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName Mosaic-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: web/Mosaic-Setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Mosaic ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Mosaic as native apps. Both run the offline demo: an in-app mock backend seeded with the
            fictional persona Sam. No server, no account, nothing leaves the device.

            | Platform | Download |
            |---|---|
            | Android 7+ | **Mosaic.apk** |
            | Windows 10/11 | **Mosaic-Setup.exe** |

            Android: allow "Install unknown apps" for your browser or file manager when asked.
            Windows: the installer is unsigned, so SmartScreen may warn. Choose **More info → Run anyway**.
          files: |
            out/Mosaic.apk
            out/Mosaic-Setup.exe
          fail_on_unmatched_files: true
