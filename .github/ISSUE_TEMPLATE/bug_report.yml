name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Today
        2. Tap Done on the priority card
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Web demo, Web app + API, API only, MCP server, CLI]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / Node version
      placeholder: Chrome 140, Node 24.1
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data before pasting.
