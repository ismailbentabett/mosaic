name: Feature request
description: Suggest a module, tool or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What job are you trying to get done?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work in the UI, and from chat (MCP)?
  - type: checkboxes
    id: parity
    attributes:
      label: Parity
      options:
        - label: This should also be available as an MCP tool.
